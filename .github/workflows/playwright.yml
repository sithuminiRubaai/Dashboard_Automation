name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    name: Playwright tests (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build test summary
        if: always()
        id: summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const reportPath = 'test-result/cucumber-report.json';
          const outPath = 'test-result/email-summary.txt';

          let scenarios = 0;
          let scenariosPassed = 0;
          let scenariosFailed = 0;
          let stepsPassed = 0;
          let stepsFailed = 0;
          let stepsSkipped = 0;

          if (fs.existsSync(reportPath)) {
            const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            for (const feature of data) {
              for (const element of (feature.elements || [])) {
                if (element.type === 'scenario' || element.type === 'Scenario') {
                  scenarios += 1;
                  let failed = false;
                  for (const step of (element.steps || [])) {
                    const status = step.result?.status || '';
                    if (status === 'passed') stepsPassed += 1;
                    else if (status === 'failed') {
                      stepsFailed += 1;
                      failed = true;
                    } else if (status === 'skipped' || status === 'pending' || status === 'undefined') {
                      stepsSkipped += 1;
                    }
                  }
                  if (failed) scenariosFailed += 1;
                  else scenariosPassed += 1;
                }
              }
            }
          }

          const lines = [
            `Repository: ${process.env.GITHUB_REPOSITORY}`,
            `Workflow: ${process.env.GITHUB_WORKFLOW}`,
            `Run URL: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            '',
            'Test Summary',
            `Scenarios: ${scenarios}`,
            `Scenarios Passed: ${scenariosPassed}`,
            `Scenarios Failed: ${scenariosFailed}`,
            `Steps Passed: ${stepsPassed}`,
            `Steps Failed: ${stepsFailed}`,
            `Steps Skipped: ${stepsSkipped}`,
          ];

          fs.mkdirSync('test-result', { recursive: true });
          fs.writeFileSync(outPath, lines.join('\n'));

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Cucumber Test Summary\n\n${lines.join('\n')}\n`);
          NODE

      - name: Upload test report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-result/cucumber-report.json
            test-result/cucumber-report.html
            test-result/email-summary.txt
          if-no-files-found: warn

      - name: Send summary email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: sithumini@rubaai.net
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Test Summary - ${{ github.repository }} #${{ github.run_number }}"
          to: liseyanth@rubaai.net
          from: sithumini@rubaai.net
          body: |
            Hi,

            Please find the latest test summary report attached.

            Run URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: |
            test-result/email-summary.txt
            test-result/cucumber-report.json
