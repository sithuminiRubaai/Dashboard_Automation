import { Browser, BrowserContext, chromium, firefox, webkit } from 'playwright';

let browser: Browser | null = null;

export async function invokeBrowser(): Promise<Browser> {
  const browserType = (process.env.BROWSER ?? 'chromium').toLowerCase();
  const headless = process.env.HEADLESS !== 'false';

  if (browser) return browser;

  switch (browserType) {
    case 'firefox':
      browser = await firefox.launch({ headless });
      break;

    case 'webkit':
      browser = await webkit.launch({ headless });
      break;

    default:
      browser = await chromium.launch({
        headless,
        args: ['--no-sandbox', '--disable-dev-shm-usage'],
      });
      break;
  }

  return browser;
}

export async function createBrowserContext(): Promise<BrowserContext> {
  const b = browser ?? (await invokeBrowser());
  return await b.newContext({
    viewport: {
      width: 1920,
      height: 1080,
    },
  });
}

export async function closeBrowser(): Promise<void> {
  if (browser) {
    await browser.close();
    browser = null;
  }
}
